<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walkable 3D City - Three.js</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        #instructions {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px;
            font-size: 16px;
            pointer-events: none;
            letter-spacing: 1px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="instructions">Click to Play &bull; Use <b>WASD</b> to Move &bull; <b>Mouse</b> to Look Around</div>

    <!-- Import Three.js and PointerLockControls via ESM -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        let camera, scene, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        
        // City layout arrays for collision tracking
        const colliders = [];

        init();
        animate();

        function init() {
            // 1. Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050510);
            scene.fog = new THREE.FogExp2(0x050510, 0.015);

            // 2. Camera Setup
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 10);

            // 3. Controls Setup
            controls = new PointerLockControls(camera, document.body);

            const instructions = document.getElementById('instructions');
            document.body.addEventListener('click', () => {
                controls.lock();
            });

            controls.addEventListener('lock', () => {
                instructions.style.display = 'none';
            });

            controls.addEventListener('unlock', () => {
                instructions.style.display = 'block';
            });

            scene.add(controls.object);

            // Movement Event Listeners
            const onKeyDown = (event) => {
                switch (event.code) {
                    case 'KeyW': moveForward = true; break;
                    case 'KeyA': moveLeft = true; break;
                    case 'KeyS': moveBackward = true; break;
                    case 'KeyD': moveRight = true; break;
                }
            };

            const onKeyUp = (event) => {
                switch (event.code) {
                    case 'KeyW': moveForward = false; break;
                    case 'KeyA': moveLeft = false; break;
                    case 'KeyS': moveBackward = false; break;
                    case 'KeyD': moveRight = false; break;
                }
            };

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);

            // 4. Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0x88bbff, 0.8);
            dirLight.position.set(50, 100, 50);
            scene.add(dirLight);

            // 5. Build Environment
            createGround();
            createCityGrid();
            createStreetLights();

            // 6. Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            window.addEventListener('resize', onWindowResize);
        }

        function createGround() {
            // Ground / Asphalt
            const groundGeo = new THREE.PlaneGeometry(400, 400);
            const groundMat = new THREE.MeshStandardMaterial({ 
                color: 0x111115, 
                roughness: 0.8 
            });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);
        }

        function createCityGrid() {
            const blockSize = 14;
            const roadWidth = 6;
            const gridSize = 6; // Grid count in both directions

            const buildingMat = new THREE.MeshStandardMaterial({
                color: 0x1c1c24,
                roughness: 0.3,
                metalness: 0.2
            });

            const windowMat = new THREE.MeshBasicMaterial({
                color: 0xffea9f
            });

            for (let x = -gridSize; x <= gridSize; x++) {
                for (let z = -gridSize; z <= gridSize; z++) {
                    // Skip center to keep spawn clear
                    if (Math.abs(x) <= 1 && Math.abs(z) <= 1) continue;

                    const posX = x * (blockSize + roadWidth);
                    const posZ = z * (blockSize + roadWidth);
                    
                    // Vary building dimensions
                    const width = blockSize + Math.random() * 2 - 1;
                    const depth = blockSize + Math.random() * 2 - 1;
                    const height = 20 + Math.random() * 60;

                    const geom = new THREE.BoxGeometry(width, height, depth);
                    const building = new THREE.Mesh(geom, buildingMat);
                    building.position.set(posX, height / 2, posZ);
                    building.castShadow = true;
                    building.receiveShadow = true;
                    scene.add(building);

                    // Push bounding box for basic collision detection
                    colliders.push({
                        minX: posX - width / 2 - 0.5,
                        maxX: posX + width / 2 + 0.5,
                        minZ: posZ - depth / 2 - 0.5,
                        maxZ: posZ + depth / 2 + 0.5
                    });

                    // Add simple glowing window accents
                    if (Math.random() > 0.3) {
                        const winGeom = new THREE.BoxGeometry(width * 0.8, height * 0.7, depth * 0.8);
                        const windows = new THREE.Mesh(winGeom, windowMat);
                        windows.position.set(posX, height / 2, posZ);
                        scene.add(windows);
                    }
                }
            }
        }

        function createStreetLights() {
            const lightGeom = new THREE.CylinderGeometry(0.1, 0.1, 6);
            const lightMat = new THREE.MeshStandardMaterial({ color: 0x333333 });

            // Place a few decorative street lights around roads
            for (let x = -30; x <= 30; x += 20) {
                for (let z = -30; z <= 30; z += 20) {
                    const pole = new THREE.Mesh(lightGeom, lightMat);
                    pole.position.set(x, 3, z);
                    scene.add(pole);

                    const pointLight = new THREE.PointLight(0xffaa33, 1, 10);
                    pointLight.position.set(x, 5.8, z);
                    scene.add(pointLight);
                }
            }
        }

        function checkCollision(targetPosition) {
            const radius = 0.6; // Player collision radius
            for (let box of colliders) {
                if (
                    targetPosition.x + radius > box.minX &&
                    targetPosition.x - radius < box.maxX &&
                    targetPosition.z + radius > box.minZ &&
                    targetPosition.z - radius < box.maxZ
                ) {
                    return true; // Collision detected
                }
            }
            return false;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            if (controls.isLocked === true) {
                const delta = (time - prevTime) / 1000;

                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize(); // Ensure consistent speed diagonally

                if (moveForward || moveBackward) velocity.z -= direction.z * 40.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 40.0 * delta;

                // Predict next X and Z positions for collision checking
                const oldPosition = controls.object.position.clone();

                controls.moveRight(-velocity.x * delta);
                if (checkCollision(controls.object.position)) {
                    controls.object.position.x = oldPosition.x; // Revert X on collision
                }

                controls.moveForward(-velocity.z * delta);
                if (checkCollision(controls.object.position)) {
                    controls.object.position.z = oldPosition.z; // Revert Z on collision
                }

                // Lock camera height to walking level
                controls.object.position.y = 2.0;
            }

            prevTime = time;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
