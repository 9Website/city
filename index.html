<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Gun Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
            user-select: none;
        }
        #blocker {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            cursor: pointer;
            z-index: 10;
        }
        #instructions {
            text-align: center;
            font-size: 24px;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 20px;
            text-shadow: 2px 2px 2px black;
            pointer-events: none;
            display: none;
            z-index: 5;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            border: 2px solid white;
            border-radius: 50%;
            pointer-events: none;
            display: none;
            z-index: 5;
        }
    </style>
</head>
<body>
    <div id="blocker">
        <div id="instructions">
            <h1>3D Gun Game</h1>
            <p>Click to Play</p>
            <p style="font-size: 14px; color: #aaa;">Move: W, A, S, D | Look: Mouse | Shoot: Left Click | Reload: R</p>
        </div>
    </div>
    <div id="ui">
        Score: <span id="score">0</span> | Ammo: <span id="ammo">30</span> / 30
    </div>
    <div id="crosshair"></div>

    <!-- Three.js and PointerLockControls CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

    <script>
        let camera, scene, renderer, controls;
        let moveFwd = false, moveBwd = false, moveLeft = false, moveRight = false;
        let prevTime = performance.now();
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();

        let score = 0;
        let ammo = 30;
        const maxAmmo = 30;
        let isReloading = false;

        const targets = [];
        const raycaster = new THREE.Raycaster();
        let gun, muzzleFlash;

        init();
        animate();

        function init() {
            // Scene & Camera
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111122);
            scene.fog = new THREE.FogExp2(0x111122, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.y = 1.6;

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Controls
            controls = new THREE.PointerLockControls(camera, document.body);

            const blocker = document.getElementById('blocker');
            const ui = document.getElementById('ui');
            const crosshair = document.getElementById('crosshair');

            blocker.addEventListener('click', () => { controls.lock(); });

            controls.addEventListener('lock', () => {
                blocker.style.display = 'none';
                ui.style.display = 'block';
                crosshair.style.display = 'block';
            });

            controls.addEventListener('unlock', () => {
                blocker.style.display = 'flex';
                ui.style.display = 'none';
                crosshair.style.display = 'none';
            });

            scene.add(controls.getObject());

            // Keyboard Listeners
            document.addEventListener('keydown', (e) => {
                if (e.code === 'KeyW') moveFwd = true;
                if (e.code === 'KeyS') moveBwd = true;
                if (e.code === 'KeyA') moveLeft = true;
                if (e.code === 'KeyD') moveRight = true;
                if (e.code === 'KeyR') reload();
            });

            document.addEventListener('keyup', (e) => {
                if (e.code === 'KeyW') moveFwd = false;
                if (e.code === 'KeyS') moveBwd = false;
                if (e.code === 'KeyA') moveLeft = false;
                if (e.code === 'KeyD') moveRight = false;
            });

            window.addEventListener('click', () => {
                if (controls.isLocked && !isReloading) {
                    shoot();
                }
            });

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(50, 100, 50);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // Arena Environment
            createEnvironment();

            // Gun Model
            createGun();

            // Spawn Targets
            for (let i = 0; i < 15; i++) {
                spawnTarget();
            }

            window.addEventListener('resize', onWindowResize);
        }

        function createEnvironment() {
            // Floor
            const floorGeo = new THREE.PlaneGeometry(200, 200);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            const grid = new THREE.GridHelper(200, 50, 0x444444, 0x222222);
            grid.position.y = 0.01;
            scene.add(grid);

            // Obstacles
            const boxMat = new THREE.MeshStandardMaterial({ color: 0x445566, roughness: 0.5 });
            for (let i = 0; i < 30; i++) {
                const w = Math.random() * 4 + 2;
                const h = Math.random() * 8 + 2;
                const d = Math.random() * 4 + 2;
                const box = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), boxMat);
                
                let x = (Math.random() - 0.5) * 160;
                let z = (Math.random() - 0.5) * 160;
                if (Math.abs(x) < 15 && Math.abs(z) < 15) x += 25;

                box.position.set(x, h / 2, z);
                box.castShadow = true;
                box.receiveShadow = true;
                scene.add(box);
            }
        }

        function createGun() {
            gun = new THREE.Group();

            // Body
            const body = new THREE.Mesh(
                new THREE.BoxGeometry(0.12, 0.15, 0.6),
                new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.8, roughness: 0.2 })
            );
            body.position.set(0.2, -0.2, -0.5);
            gun.add(body);

            // Barrel
            const barrel = new THREE.Mesh(
                new THREE.CylinderGeometry(0.03, 0.03, 0.4, 16),
                new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9 })
            );
            barrel.rotation.x = Math.PI / 2;
            barrel.position.set(0.2, -0.15, -0.8);
            gun.add(barrel);

            // Muzzle flash
            muzzleFlash = new THREE.Mesh(
                new THREE.SphereGeometry(0.05, 8, 8),
                new THREE.MeshBasicMaterial({ color: 0xffff00 })
            );
            muzzleFlash.position.set(0.2, -0.15, -1.0);
            muzzleFlash.visible = false;
            gun.add(muzzleFlash);

            camera.add(gun);
            scene.add(camera);
        }

        function spawnTarget() {
            const target = new THREE.Mesh(
                new THREE.SphereGeometry(1, 16, 16),
                new THREE.MeshStandardMaterial({ color: 0xff3333, roughness: 0.3, emissive: 0x330000 })
            );

            let x = (Math.random() - 0.5) * 160;
            let z = (Math.random() - 0.5) * 160;
            while (Math.abs(x) < 15 && Math.abs(z) < 15) {
                x = (Math.random() - 0.5) * 160;
                z = (Math.random() - 0.5) * 160;
            }

            target.position.set(x, Math.random() * 4 + 1, z);
            target.castShadow = true;
            scene.add(target);
            targets.push(target);
        }

        function shoot() {
            if (ammo <= 0) {
                reload();
                return;
            }

            ammo--;
            document.getElementById('ammo').innerText = ammo;

            muzzleFlash.visible = true;
            setTimeout(() => { muzzleFlash.visible = false; }, 50);

            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(targets);

            if (intersects.length > 0) {
                const hitTarget = intersects[0].object;
                scene.remove(hitTarget);
                targets.splice(targets.indexOf(hitTarget), 1);

                score += 10;
                document.getElementById('score').innerText = score;

                setTimeout(spawnTarget, 1000);
            }
        }

        function reload() {
            if (isReloading || ammo === maxAmmo) return;
            isReloading = true;
            document.getElementById('ui').style.color = '#ffaa00';
            setTimeout(() => {
                ammo = maxAmmo;
                document.getElementById('ammo').innerText = ammo;
                document.getElementById('ui').style.color = 'white';
                isReloading = false;
            }, 1200);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            if (controls.isLocked) {
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveFwd) - Number(moveBwd);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveFwd || moveBwd) velocity.z -= direction.z * 400.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 400.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
            }

            prevTime = time;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
